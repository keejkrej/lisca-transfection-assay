[project]
name = "transfection"
version = "0.1.3"
description = "Transfection analysis stages for LiSCA workspaces (assay.json + roi/)."
requires-python = ">=3.12"
dependencies = [
  "imageio",
  "imageio-ffmpeg",
  "lisca",
  "marimo",
  "markdown-it-py<4",
  "matplotlib",
  "numpy",
  "openpyxl>=3.1.5",
  "pandas<3",
  "tifffile",
  "typer",
]

[project.scripts]
transfection = "transfection.main:main"

[build-system]
requires = ["hatchling", "pathspec<0.13"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transfection"]

[tool.uv.sources]
# lisca base only (no lisca[analysis] — that extra depends on this package).
lisca = { git = "https://github.com/keejkrej/lisca.git", subdirectory = "python", rev = "802d5a6b14bc348b70bc0bce280443033496b411" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
