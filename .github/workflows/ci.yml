# Python units + Python/Rust transfection parity gate.
# cargo test shells out to `.uv/uv run transfection`, so install.sh runs first.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: pytest + Python/Rust parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install mplot system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libfreetype6-dev \
            pkg-config \
            g++

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Point rust-lld at libstdc++
        run: echo "RUSTFLAGS=-C link-arg=-L$(dirname "$(g++ -print-file-name=libstdc++.so)")" >> "$GITHUB_ENV"

      - name: Install Python package
        run: bash install.sh

      - name: pytest
        run: .uv/uv run pytest

      - name: cargo test (includes Python/Rust parity)
        run: cargo test -p lisca-transfection

      - name: Fetch pattern U-Net ONNX
        run: bash scripts/fetch-pattern-seg-model.sh

      - name: cargo test --features onnx
        run: cargo test -p lisca-transfection --features onnx
        env:
          LISCA_PATTERN_SEG_MODEL: ${{ github.workspace }}/models/single-cell-pattern-unet/onnx
